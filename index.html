<!doctype html>
<html lang="en" style="font-size: 16px">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/png/logo_512x512.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>EXTRAPAWN — Professional Chess Training Ecosystem</title>
  <meta name="title" content="EXTRAPAWN — Professional Chess Training Ecosystem" />
  <meta name="description" content="The closed-loop chess gym for tournament players (1500+). Master openings, tactics, and endgames with human-like AI resistance and actionable analytics." />
  <meta name="keywords" content="chess training, chess gym, tournament preparation, chess improvement, endgame trainer, neural network sparring, chess openings, spaced repetition chess" />
  <meta name="author" content="ExtraPawn Team" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://extrapawn.com/" />
  <meta property="og:title" content="EXTRAPAWN — Professional Chess Training Ecosystem" />
  <meta property="og:description" content="The closed-loop chess gym for tournament players. Train everything. Digitize every skill." />
  <meta property="og:image" content="https://extrapawn.com/png/og-banner.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://extrapawn.com/" />
  <meta property="twitter:title" content="EXTRAPAWN — Professional Chess Training Ecosystem" />
  <meta property="twitter:description" content="The closed-loop chess gym for tournament players. Train everything. Digitize every skill." />
  <meta property="twitter:image" content="https://extrapawn.com/png/og-banner.png" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#121212" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ExtraPawn",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "1250"
      },
      "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "EUR"
      },
      "description": "Professional chess training ecosystem for tournament players (1500+). Featuring 'Finish Him' realization trainer and adaptive chess tactics.",
      "author": {
        "@type": "Organization",
        "name": "ExtraPawn"
      }
    }
  </script>
</head>

<body>
  <div id="app">
    <!-- Initial Loading Shell (Dunkler Hintergrund gegen weißen Bildschirm) -->
    <div class="initial-shell">
      <div class="shell-content">
        <img src="/webp/extra_pawn_black.webp" alt="Logo" class="shell-logo" />
        <div class="shell-spinner"></div>
        <div class="shell-text">extrapawn.com</div>
      </div>
      <style>
        .initial-shell {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #121212;
          z-index: 99999;
          font-family: 'Ubuntu', sans-serif;
        }
        .shell-content {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .shell-logo {
          width: 200px;
          height: auto;
          margin-bottom: 30px;
        }
        .shell-spinner {
          width: 28px;
          height: 28px;
          border: 2px solid #2e2e2e;
          border-top: 2px solid #3ecf8e;
          border-radius: 50%;
          animation: spin 0.9s linear infinite;
          margin-bottom: 16px;
        }
        .shell-text {
          font-size: 1.5rem;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin: 0;
          color: #ededed;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </div>
  <script type="module" src="/src/app/main.ts"></script>
</body>

</html>

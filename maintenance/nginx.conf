map $http_user_agent $loggable {
    ~*Wget  0;
    default 1;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log combined if=$loggable;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /png/logo_512x512.png =204;
    }

    # Static assets for the maintenance page
    location ~* ^/(webp/|png/|fonts/|quotes/|maintenance_art\.jpg) {
        access_log off;
        log_not_found off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Maintenance-Mode "1" always;
        try_files $uri =404;
    }

    # API calls while frontend is stopped -> clean 503 JSON
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Maintenance-Mode "1" always;
        return 503 '{"error":"Service temporarily under maintenance"}';
    }

    # All page routes -> serve maintenance index.html without browser caching
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Maintenance-Mode "1" always;
        try_files /index.html =503;
    }
}


# Ключ для лимитов: строго по IP клиента ($binary_remote_addr).
# Обход лимита разрешён ТОЛЬКО для верифицированных ролей developer и owner ($user_role,
# заполняемый исключительно внутренним подзапросом auth_request /api/auth/check).
map $user_role $limit_key_ip {
    "developer" "";
    "owner"     "";
    default     $binary_remote_addr;
}

# Отключаем логи для Wget (Health-Checks от Dokploy)
map $http_user_agent $loggable {
    ~*Wget  0;
    default 1;
}

# Зоны лимитов: общий API (15 r/s), тяжёлые CPU-движки (5 r/s),
# а также анти-скрапинг лимиты на создание сессий (10 r/m) и фиксацию попыток (30 r/m)
limit_req_zone $limit_key_ip zone=api_limit:10m rate=15r/s;
limit_req_zone $limit_key_ip zone=engine_limit:10m rate=5r/s;
limit_req_zone $limit_key_ip zone=session_create_limit:10m rate=10r/m;
limit_req_zone $limit_key_ip zone=attempt_limit:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

# Доверяем внутренним подсетям Docker/Dokploy для извлечения реального IP из Traefik
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1M;

    access_log /var/log/nginx/access.log combined if=$loggable;

    # DNS-резолвер Docker (необходим для переменных в proxy_pass)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_vary on;

    # Globale Security Headers (действуют, если в location нет собственного add_header)
    include /etc/nginx/security-headers.conf;

    # 1. Точки входа SPA: всегда ревалидировать ETag
    location ~* ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # 1b. Блокировка и глушение сканеров/ботов (.env, .git, PHP/WordPress, Spring Actuator, бэкапы)
    location ~* (?:/\.(?!well-known)|/actuator/|/wp-admin/|/wp-includes/|/phpmyadmin/|/bin/|/etc/|/var/|\.(?:bak|co?nf|cfg|dist|fla|in[ci]|log|psd|ini|sh|sql|sw[op]|yml|yaml|zip|tar|rar|exe|php|jsp|asp|aspx)$|client_secret\.json$|credentials\.json$|aws\.json$|/heapdump|/configprops) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. SPA-маршрутизатор
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Хэшированные Vite-ассеты (/assets/): кэш 1 год + immutable
    location /assets/ {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # 4. Статика (изображения, звуки, иконки)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        try_files /png/logo_512x512.png =204;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|mp3|wav)$ {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/security-headers.conf;
    }

    # 5. WASM-движки (ревалидация ETag)
    location ~* \.wasm$ {
        access_log off;
        log_not_found off;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # 5b. Локальный Stockfish WASM (Cache Storage API на клиенте)
    location ^~ /stockfish/ {
        access_log off;
        log_not_found off;
        types {
            application/javascript js;
            application/wasm wasm;
        }
        add_header Cache-Control "public, no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # 6. MJS handler
    location ~ \.mjs$ {
        access_log off;
        log_not_found off;
        root /usr/share/nginx/html;
        default_type application/javascript;
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # =========================================================================
    # 7. Backend Proxy & API Routing (Strict Whitelist + Auth Gate)
    # =========================================================================
    location = /api/auth/check {
        internal;
        set $auth_backend http://fastify-app:3000/api/auth/check;
        proxy_pass $auth_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    # 7a. Coach Engine (coach_sf: /uci_fen)
    location /api/coach-engine/ {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @coach_engine;
    }

    location @coach_engine {
        limit_req zone=engine_limit burst=15 nodelay;
        set $coach_engine_backend http://coach_sf:5000;
        rewrite ^/api/coach-engine/(.*) /$1 break;
        proxy_pass $coach_engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7b. Sparring Engine Hub (engine-hub: /bestmove)
    location = /api/bestmove {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @bestmove;
    }

    location @bestmove {
        limit_req zone=engine_limit burst=15 nodelay;
        set $engine_backend http://engine-hub:5000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7c. TableService Endgame Archive Analyzer (до 15 МБ сжатого .json.gz)
    location = /api/engine-eval/endgame/analyze {
        client_max_body_size 15M;
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @endgame_analyze;
    }

    location @endgame_analyze {
        client_max_body_size 15M;
        limit_req zone=engine_limit burst=5 nodelay;
        set $table_backend http://tableservice:5000;
        rewrite ^/api/engine-eval/endgame/(.*) /api/endgame/$1 break;
        proxy_pass $table_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7d. TableService Opening Masters Book
    location = /api/opening/mozer_book {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @mozer_book;
    }

    location @mozer_book {
        limit_req zone=api_limit burst=30 nodelay;
        set $table_backend http://tableservice:5000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $table_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7e. Публичные маршруты puzzle_service (Дипломы и демо-витрина Кабинета) — принудительно очищаем X-User-Id / X-User-Role
    location ~ ^/api/training/courses/[0-9a-fA-F-]+/diploma$ {
        limit_req zone=api_limit burst=30 nodelay;
        set $training_backend http://puzzle-engine:5000;
        proxy_pass $training_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* ^/api/training/cabinet/public/mo3ep$ {
        limit_req zone=api_limit burst=30 nodelay;
        set $training_backend http://puzzle-engine:5000;
        proxy_pass $training_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 7e-bis. Закрываем снаружи внутренние эндпоинты puzzle_service (используются только EXTRAPAWN_MINI по внутренней сети Docker)
    location ^~ /api/training/puzzle/ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location = /api/training/catalog-info {
        access_log off;
        log_not_found off;
        return 404;
    }

    # 7f. Защищённые маршруты puzzle_service (с анти-скрапинг лимитами для создания сессий и попыток)
    location ~ ^/api/training/sessions/(?:course|warmup)$ {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @training_session_create;
    }

    location @training_session_create {
        limit_req zone=session_create_limit burst=5 nodelay;
        set $training_backend http://puzzle-engine:5000;
        proxy_pass $training_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/training/sessions/[0-9a-fA-F-]+/attempt$ {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @training_attempt;
    }

    location @training_attempt {
        limit_req zone=attempt_limit burst=15 nodelay;
        set $training_backend http://puzzle-engine:5000;
        proxy_pass $training_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/training/ {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        try_files "" @training_engine;
    }

    location @training_engine {
        limit_req zone=api_limit burst=30 nodelay;
        set $training_backend http://puzzle-engine:5000;
        proxy_pass $training_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 7g. Явный белый список маршрутов app_fastify (/api/auth/*, /api/users/*, /api/gaviota/*)
    location ~ ^/api/(?:auth|users|gaviota)/ {
        limit_req zone=api_limit burst=30 nodelay;
        set $upstream_fastify http://fastify-app:3000;
        proxy_pass $upstream_fastify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 7h. Отсечение любых неизвестных /api/* сканер-запросов на уровне Nginx (0 мс, без шума в логах бэкенда)
    location = /api {
        access_log off;
        log_not_found off;
        return 404;
    }

    location /api/ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Вычисляем ключ для лимитов: токен сессии (если есть) oder IP (для анонимов)
map $cookie_chess_session_id $limit_key {
    default $cookie_chess_session_id;
    ""      $binary_remote_addr;
}

# Ausnahme für MO3EP (mo3ep) - bypass rate limit
map $user_id $limit_key_user {
    "mo3ep" "";
    default $limit_key;
}

# Отключаем логи для Wget (Health-Checks von Dokploy)
map $http_user_agent $loggable {
    ~*Wget  0;
    default 1;
}

# Зона лимитов на основе гибридного ключа (15 r/s)
limit_req_zone $limit_key_user zone=api_limit:10m rate=15r/s;
# Статус ответа при превышении лимита
limit_req_status 429;
# Уровень логирования при превышении лимита (предотвращает спам в логах ошибок)
limit_req_log_level warn;

# Docker/Dokploy internen IPs vertrauen
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Echte IP aus dem Header von Traefik extrahieren
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    # listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30M;

    # Logging Filter anwenden
    access_log /var/log/nginx/access.log combined if=$loggable;

    # DNS-резолвер Docker. Необходим для корректной работы переменных в proxy_pass.
    resolver 127.0.0.11 valid=10m;

    # Gzip Compression
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_vary on;

    # Globale Security Headers (Greifen nur, wenn im location-Block KEIN add_header steht!)
    include /etc/nginx/security-headers.conf;

    # 1. Einstiegspunkte: Immer revalidieren (ETag) -> "no-cache" bedeutet: Speichern ja, aber Server vorher fragen
    location ~* ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-cache";
        
        # Security Headers MÜSSEN hier wiederholt werden wegen Nginx Vererbung!
        include /etc/nginx/security-headers.conf;
        
        try_files $uri =404;
    }

    # 1b. Scanner- und Bot-Probes blockieren & stummschalten
    # Blockiert versteckte Dateien (.env, .git, etc.), sensitive Java/Spring-Endpoints, PHP/WordPress-Scans und Backup-/Konfigurationsendungen.
    # Verhindert fälschliche "200 OK" Antworten durch das SPA-Fallback und entlastet das Fastify-Backend.
    location ~* (?:/\.(?!well-known)|/actuator/|/wp-admin/|/wp-includes/|/phpmyadmin/|/bin/|/etc/|/var/|\.(?:bak|co?nf|cfg|dist|fla|in[ci]|log|psd|ini|sh|sql|sw[op]|yml|yaml|zip|tar|rar|exe|php|jsp|asp|aspx)$|client_secret\.json$|credentials\.json$|aws\.json$|/heapdump|/configprops) {
        return 404;
        log_not_found off;
        access_log off;
    }

    # 2. Haupt-Location (Filter für Dokploy Health-Checks jetzt via globalem Map gelöst)
    location / {
        # Hier greifen die globalen Security Headers, da kein eigener add_header existiert.
        try_files $uri $uri/ /index.html;
    }

    # 3. Gehashte Vite-Dateien (/assets/): Brutal cachen (1 Jahr + immutable)
    location /assets/ {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Security Headers
        include /etc/nginx/security-headers.conf;
    }

    # 4. Statische Assets (Bilder, Sounds): Mit normalem Caching
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|mp3|wav)$ {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        
        # Security Headers
        include /etc/nginx/security-headers.conf;
    }

    # 5. Statische Engines/WASM (ohne Hash): Clever cachen mit Revalidierung (ETag)
    location ~* \.wasm$ {
        access_log off;
        log_not_found off;
        add_header Cache-Control "no-cache";
        
        # Security Headers
        include /etc/nginx/security-headers.conf;
    }

    # 5b. New path for Stockfish npm version
    location /npm_stockfish/ {
        access_log off;
        log_not_found off;
        
        # Перестраховка: задаем типы и для воркера, и для бинарника
        types {
            application/javascript js;
            application/wasm wasm;
        }

        add_header Cache-Control "no-cache";
        
        # Security Headers
        include /etc/nginx/security-headers.conf;
    }

    # 6. MJS handler
    location ~ \.mjs$ {
        access_log off;
        log_not_found off;
        root /usr/share/nginx/html;
        default_type application/javascript;
        types {
            application/javascript mjs;
        }
        
        add_header Cache-Control "no-cache";
        
        # Security Headers
        include /etc/nginx/security-headers.conf;
    }

    # 7. Backend Proxy & API Routing (unverändert)
    location = /api/auth/check {
        internal;
        set $auth_backend http://fastify-app:3000/api/auth/check;
        proxy_pass $auth_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }


    location /api/coach-engine/analyze {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        try_files "" @coach_engine_analyze;
    }

    location @coach_engine_analyze {
        limit_req zone=api_limit burst=15 nodelay;
        set $coach_engine_backend http://stockfish_server:5000;
        rewrite ^/api/coach-engine/(.*) /$1 break;
        proxy_pass $coach_engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/bestmove {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        try_files "" @bestmove;
    }

    location @bestmove {
        limit_req zone=api_limit burst=15 nodelay;
        set $engine_backend http://stockfish_server:5000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/tactics/ {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        try_files "" @tactics;
    }

    location @tactics {
        limit_req zone=api_limit burst=30 nodelay;
        set $upstream_fastify http://fastify-app:3000;
        proxy_pass $upstream_fastify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/engine-eval/endgame/analyze {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        try_files "" @endgame_analyze;
    }

    location @endgame_analyze {
        limit_req zone=api_limit burst=30 nodelay;
        set $engine_backend http://stockfish_server:5000;
        rewrite ^/api/engine-eval/endgame/(.*) /api/endgame/$1 break;
        proxy_pass $engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/opening/mozer_book {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        try_files "" @mozer_book;
    }

    location @mozer_book {
        limit_req zone=api_limit burst=30 nodelay;
        set $engine_backend http://stockfish_server:5000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/position/full {
        auth_request /api/auth/check;
        auth_request_set $user_id $upstream_http_x_user_id;
        try_files "" @position_full;
    }

    location @position_full {
        limit_req zone=api_limit burst=30 nodelay;
        set $engine_backend http://stockfish_server:5000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $engine_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        set $upstream_fastify http://fastify-app:3000;
        proxy_pass $upstream_fastify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}